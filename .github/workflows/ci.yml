name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4  # runs mods/auto.ts in tests/test_auto_mod.py
        with:
          node-version: "24"
      - run: uv sync --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - name: pytest
        run: uv run pytest -q -rs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv build
      - name: MCP server from the wheel, outside the plugin (FR-M1)
        run: |
          uv venv /tmp/wheel-venv
          VIRTUAL_ENV=/tmp/wheel-venv uv pip install dist/*.whl
          uv run python scripts/check_mcp_client.py -- /tmp/wheel-venv/bin/cigar-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
