[project]
name = "cigar-break"
version = "0.1.0.dev0"
description = "Detects when a coding agent's session is degrading, gets a structured handoff, and restores it after a context reset."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mohamed Youssef" }]
dependencies = []

[project.scripts]
cigar = "cigar.cli:main"
cigar-mcp = "cigar.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mcp>=1.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cigar"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"bin/*" = ["UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: performance measurement (prints the hook p95)"]
